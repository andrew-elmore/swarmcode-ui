name: Deploy UI to Production

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT: swarmcode-prod

jobs:
  test:
    name: Lint & Test UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: swarmcode-ui

      - uses: actions/checkout@v4
        with:
          repository: andrew-elmore/swarmcode-api
          token: ${{ secrets.API_REPO_TOKEN }}
          path: swarmcode-api

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install API dependencies
        run: cd swarmcode-api && npm ci

      - name: Install UI dependencies
        run: cd swarmcode-ui && npm ci

      - name: Install Playwright browsers
        run: cd swarmcode-ui && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd swarmcode-ui && npx playwright test --project=chromium

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: swarmcode-ui/test-results/
          retention-days: 7

  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npx webpack --config webpack.config.cjs
        env:
          NODE_ENV: production
          REACT_APP_PARSE_APP_ID: ${{ secrets.PROD_APP_ID }}
          REACT_APP_PARSE_REST_API_KEY: ${{ secrets.PROD_REST_API_KEY }}
          REACT_APP_PARSE_URL: /parse
          REACT_APP_PARSE_LIVEQUERY_URL: wss://swarmcode-api-616102704370.us-central1.run.app/parse

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ env.GCP_PROJECT }}
          channelId: live
