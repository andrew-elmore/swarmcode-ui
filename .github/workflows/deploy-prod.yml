name: Deploy UI to Production

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT: swarmcode-prod

jobs:
  test:
    name: Lint & Test UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UI
        run: npx webpack --config webpack.config.cjs
        env:
          NODE_ENV: production
          REACT_APP_PARSE_APP_ID: ${{ secrets.PROD_APP_ID }}
          REACT_APP_PARSE_REST_API_KEY: ${{ secrets.PROD_REST_API_KEY }}
          REACT_APP_PARSE_URL: /parse

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ env.GCP_PROJECT }}
          channelId: live
